schema: spec-driven

# Planning context injected into every artifact, apply, and archive.
# Keep this as constraints for plans, not a copy of AGENTS.md.
context: |
  本仓库是 GeekAgent 教程（https://geektutu.com/books/geekagent）的 Rust 学习实现，不是生产级编码代理。所有者是 Rust 初学者。规划与实现都要可教、可增量运行，而不是追求框架完整性。

  写所有 OpenSpec 产物（proposal / specs / design / tasks）用中文。代码标识符、模块路径、crate 名用英文。

  三条硬约束：
  1. 最简单：不引入 Agent/CLI 框架；核心依赖从「调 OpenAI 兼容接口 + 读环境变量」长出来，当天用不到的 crate 不要写进计划。
  2. 一次变更一个可运行切片：对应教程一天的能力，结束时 cargo run 能看到效果。
  3. 只增量不推翻：在已有模块上扩展。禁止把「重写前一天」写进设计或任务，除非 proposal 标明 BREAKING 且用户同意。

  技术栈：Rust 2024 edition，二进制 crate geer-agent，入口 src/main.rs。当前几乎是空壳。测试与检查用 cargo test / cargo fmt / cargo clippy，没有 CI。

  把教程当行为来源，不要当 TypeScript 逐行翻译稿。design 必须说明概念如何映射到 Rust（所有权、错误处理、模块、异步），而不是复刻 dayN/ 目录或 npm 包名。

  能力（specs）扁平放在 openspec/specs/<id>/spec.md，id 用 kebab-case，不要用 day1 这种日程号。对照：repl-chat, tool-loop, bash-tool, file-tools, history-compaction, session-persistence, tui, permissions, subagents, project-memory, skills, search-fetch, active-memory, knowledge-rag, mcp, plugins。能复用现有能力就复用。纯重构/文档/工具链用 skip_specs，不要编造 requirement。

  模型接口语义对齐教程：OpenAI 兼容的 base_url / api_key / model，缺 key 必须失败可见。密钥不得写入任何产物。

rules:
  proposal:
    - 用中文写，控制在约一页；必须有 Non-goals。
    - 若对应教程某天，写明日程编号和能力 id（见 context 对照表），不要把日程号当成 spec 路径。
    - What Changes 只写可观察行为；实现细节留给 design.md。
    - 行为不变就 skip_specs，不要为了通过校验编造能力。
  specs:
    - 只写可观察行为、输入输出、错误与失败可见性；禁止出现 crate、类型、文件名、函数名。
    - 能力路径必须是 kebab-case 扁平 id；修改已有能力时沿用 openspec/specs/ 下的原路径。
    - 每个 requirement 用 SHALL/MUST，且至少有一个 #### Scenario（WHEN/THEN）。
    - 新能力第一条必须是不少于 50 字的 ## Purpose。
  design:
    - 说明如何在现有 Rust 模块上增量扩展，并写出每个新 crate 的理由（std 为什么不够）。
    - 对比教程概念与 Rust 映射；点名所有权、错误处理、异步/流式、配置这几处关键决策。
    - 为初学者写清「不选另一方案」的原因；Open Questions 只留真正可延后的问题。
    - 不要设计需要推翻已有可运行路径的结构，除非 proposal 已标 BREAKING。
  tasks:
    - 每个任务一次会话能做完，复选框描述里自带验证（cargo 命令或具体 REPL 步骤）。
    - 按依赖排序：先能编译运行，再加行为，最后才是打磨。
    - 禁止「重写 xxx」类任务，除非 proposal 标明 BREAKING。
    - 不要把 git push、openspec archive、或与本 change 无关的重构写进任务。

operations:
  apply:
    guidance:
      - 严格按 tasks.md 增量实现；不要顺手重写未列入任务的模块。
      - 新增依赖必须已在 design.md 论证；代码注释用中文写为什么，不要贴教程原文。
      - 一组相关任务完成后跑 cargo fmt、相关 cargo test，再跑 cargo clippy；不要用 -D warnings 当失败条件。
      - 密钥与 .env 不得入库；缺 API key 的路径要失败可见。
  archive:
    guidance:
      - 归档前确认新能力 Purpose 不是 TBD、delta 与实现一致。
      - 用几句中文总结落地的行为，不要复述 tasks 清单。
      - skip_specs 的变更不要趁归档补写行为 spec。
