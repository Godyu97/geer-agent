[package]
name = "geer-agent"
version = "0.1.0"
edition = "2024"

[features]
embed-env = []

[dependencies]
async-openai = { version = "0.42.0", features = ["chat-completion", "responses", "middleware"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dotenvy = "0.15"
futures-util = "0.3"
mongodb = "3.9.1"
sea-orm = { version = "2.0.3", default-features = false, features = ["macros", "with-json", "sqlx-mysql", "sqlx-postgres", "sqlx-sqlite", "runtime-tokio-rustls"] }
sea-orm-migration = { version = "2.0.3", default-features = false, features = ["sqlx-mysql", "sqlx-postgres", "sqlx-sqlite", "runtime-tokio-rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "time", "process", "io-util"] }
tower = "0.5"
uuid = { version = "1", features = ["v4"] }
