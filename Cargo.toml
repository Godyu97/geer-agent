[package]
name = "geer-agent"
version = "0.1.0"
edition = "2024"

[features]
embed-env = []
gui = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-clipboard-manager", "dep:tauri-plugin-dialog"]

[dependencies]
async-openai = { version = "0.42.0", features = ["chat-completion", "responses", "middleware"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
crossterm = "0.29"
dotenvy = "0.15"
futures-util = "0.3"
mongodb = "3.9.1"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
sea-orm = { version = "2.0.3", default-features = false, features = ["macros", "with-json", "sqlx-mysql", "sqlx-postgres", "sqlx-sqlite", "runtime-tokio-rustls"] }
sea-orm-migration = { version = "2.0.3", default-features = false, features = ["sqlx-mysql", "sqlx-postgres", "sqlx-sqlite", "runtime-tokio-rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12", optional = true }
tauri-plugin-clipboard-manager = { version = "2.3.2", optional = true }
tauri-plugin-dialog = { version = "2.6", optional = true }
tokio = { version = "1", features = ["macros", "rt", "time", "process", "io-util"] }
tower = "0.5"
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
tauri-build = { version = "2.7", optional = true }
